trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: templates
      type: git
      name: PetclinicAKS/petclinic-pipeline-template
      ref: master-aks

variables:
  # AKS and Common Variables
  aksServiceConnection: 'aks-service-connection'
  imageRepository: 'petclinic-app'
  dbAdminPassword: 'Replace-Me-StrongPassword-123!' # Best practice: Move this to a secret pipeline variable

  # UPDATE THIS VALUE: Replace 'a1b2c3' with the actual 6-character suffix generated by your ARM deployment
  uniqueSuffix: 'oyyzir'

  # Dev Environment
  devAcrConnection: 'dev-acr-service-connection'
  devAcrLoginServer: 'acrpetclinicdev$(uniqueSuffix).azurecr.io'
  devDbUrl: 'jdbc:postgresql://db-petclinic-dev-$(uniqueSuffix).postgres.database.azure.com:5432/petclinic'

  # Testing Environment
  testAcrConnection: 'test-acr-service-connection'
  testAcrLoginServer: 'acrpetclinictest$(uniqueSuffix).azurecr.io'
  testDbUrl: 'jdbc:postgresql://db-petclinic-testing-$(uniqueSuffix).postgres.database.azure.com:5432/petclinic'

  # Prod Environment
  prodAcrConnection: 'prod-acr-service-connection'
  prodAcrLoginServer: 'acrpetclinicprod$(uniqueSuffix).azurecr.io'
  prodDbUrl: 'jdbc:postgresql://db-petclinic-prod-$(uniqueSuffix).postgres.database.azure.com:5432/petclinic'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    steps:
    - template: build.yaml@templates
      parameters:
        jdkVersion: '1.17'
        devAcrConnection: '$(devAcrConnection)'
        imageRepository: '$(imageRepository)'

- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - template: deploy.yaml@templates
    parameters:
      environmentName: 'dev'
      namespace: 'dev'
      aksServiceConnection: '$(aksServiceConnection)'
      promoteImage: false
      targetAcrConnection: '$(devAcrConnection)'
      targetAcrLoginServer: '$(devAcrLoginServer)'
      imageRepository: '$(imageRepository)'
      imageTag: '$(Build.BuildId)'
      dbUrl: '$(devDbUrl)'
      dbPassword: '$(dbAdminPassword)'

- stage: ApproveTesting
  displayName: 'Manual Approval - Promote to Testing'
  dependsOn: DeployDev
  condition: succeeded()
  jobs:
  - job: WaitForApprovalTesting
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: 'Please validate Dev deployment and approve promotion to Testing.'

- stage: DeployTest
  displayName: 'Deploy to Testing'
  dependsOn: ApproveTesting
  condition: succeeded()
  jobs:
  - template: deploy.yaml@templates
    parameters:
      environmentName: 'testing'
      namespace: 'testing'
      aksServiceConnection: '$(aksServiceConnection)'
      promoteImage: true
      sourceAcrConnection: '$(devAcrConnection)'
      sourceAcrLoginServer: '$(devAcrLoginServer)'
      targetAcrConnection: '$(testAcrConnection)'
      targetAcrLoginServer: '$(testAcrLoginServer)'
      imageRepository: '$(imageRepository)'
      imageTag: '$(Build.BuildId)'
      dbUrl: '$(testDbUrl)'
      dbPassword: '$(dbAdminPassword)'

- stage: ApproveProd
  displayName: 'Manual Approval - Promote to Production'
  dependsOn: DeployTest
  condition: succeeded()
  jobs:
  - job: WaitForApprovalProd
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: 'Please confirm Testing sign-off is complete and approve Production deployment.'

- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: ApproveProd
  condition: succeeded()
  jobs:
  - template: deploy.yaml@templates
    parameters:
      environmentName: 'prod'
      namespace: 'prod'
      aksServiceConnection: '$(aksServiceConnection)'
      promoteImage: true
      sourceAcrConnection: '$(testAcrConnection)'
      sourceAcrLoginServer: '$(testAcrLoginServer)'
      targetAcrConnection: '$(prodAcrConnection)'
      targetAcrLoginServer: '$(prodAcrLoginServer)'
      imageRepository: '$(imageRepository)'
      imageTag: '$(Build.BuildId)'
      dbUrl: '$(prodDbUrl)'
      dbPassword: '$(dbAdminPassword)'
